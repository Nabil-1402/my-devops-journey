services:
  web:
    build:
      context: .
      dockerfile: Flask/Dockerfile
    expose: 
      - "5001"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  redis:
    build: ./Redis
    volumes:
      - redis-data:/data
  
  nginx:
    image: nginx:latest
    ports:
      - "5001:5001"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
  
volumes:
  redis-data:
  
